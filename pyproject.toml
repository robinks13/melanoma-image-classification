[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melanoma-image-classification"
version = "0.1.0"
description = "Educational PyTorch experiments for binary skin-lesion image classification"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0", "Pillow>=10.0", "torch>=2.2", "torchvision>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]
